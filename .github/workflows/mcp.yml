name: MCP Server

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "mcp/**"
      - ".github/workflows/mcp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q
