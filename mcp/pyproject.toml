[project]
name = "health-mcp"
version = "0.1.0"
description = "MCP server exposing Supabase-synced Health Connect data to Claude"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
    "psycopg[binary,pool]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/health_mcp"]

[project.scripts]
health-mcp = "health_mcp.server:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
